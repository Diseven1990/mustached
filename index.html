<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mister Master DDDDDD</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="game"></canvas>

  <div id="dangerOverlay"></div>
  <div id="warningText">O CAOS ESTÁ A CARREGAR</div>

  <div id="hud">
    <div id="scoreLabel">SCORE</div>
    <div id="score">0</div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="pauseIcon" style="display:none;"></div>
  </div>

  <div id="tapToPlay" style="display:none;"></div>


  <div id="startScreen" style="display:none;"></div>

  <div id="gameOver">
    <div id="normalEnd" class="endLayer normalEnd">
      <div class="normalCard endMenu defeatMenu">
        <div class="endTitle">Falhaste, D.</div>

        <img class="endCharacter koCharacter" src="" alt="Personagem derrotado">

        <div class="endScore">
          SCORE
          <strong id="normalScore">0</strong>
        </div>

        <div class="endButtons">
          <button id="retryButton" class="cleanBtn retry" onclick="event.stopPropagation(); restartGame(event);">Tenta de novo</button>
          <button class="cleanBtn cta" onclick="event.stopPropagation(); trackGameEvent('mister_game_cta_click', { score, ending: 'normal' }); window.location.href='https://www.masterd.pt/'">O jogo começa agora →</button>
        </div>
      </div>
    </div>

    <div id="perfectEnd" class="endLayer perfectEnd winEnd">
      <div class="winMenu">
        <div class="winTitle">O tutorial terminou.</div>

        <img class="endCharacter winCharacter" src="" alt="Personagem vencedor">

        <button class="cleanBtn winCta" onclick="event.stopPropagation(); trackGameEvent('mister_game_cta_click', { score, ending: 'perfect' }); window.location.href='https://www.masterd.pt/'">
          O jogo começa agora →
        </button>
      </div>
    </div>
  </div>

<audio id="jumpSound" preload="auto" src="assets/sounds/jump.mp3"></audio>
  <audio id="crashSound" preload="auto" src="assets/sounds/hit.mp3"></audio>
  <audio id="nearSound" preload="auto" src="assets/sounds/close.mp3"></audio>

  <script src="game.js" defer></script>
</body>
</html>
