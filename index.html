<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mustached</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <div id="sky">
      <div class="city c1"></div>
      <div class="city c2"></div>
      <div id="danger"></div>
    </div>

    <div id="playerWrap">
      <img id="player" src="assets/player/player_01.webp" alt="">
    </div>

    <div id="obstacles"></div>

    <div id="hud">
      <div class="label">SCORE</div>
      <div id="score">0</div>
      <div id="progress"><span></span></div>
    </div>

    <div id="overlay">
      <section id="lose" class="panel">
        <h1>Falhaste, D.</h1>
        <img src="assets/player/ko.webp" alt="" class="panelChar">
        <div class="panelScore">SCORE <strong id="loseScore">0</strong></div>
        <button id="retry">Tenta de novo</button>
        <button id="loseCta">O jogo começa agora →</button>
      </section>

      <section id="win" class="panel">
        <h1>O tutorial terminou.</h1>
        <img src="assets/player/win.webp" alt="" class="panelChar winChar">
        <button id="winCta">O jogo começa agora →</button>
      </section>
    </div>
  </main>

  <audio id="jumpSound" src="assets/sounds/jump.mp3" preload="auto"></audio>
  <audio id="hitSound" src="assets/sounds/hit.mp3" preload="auto"></audio>
  <audio id="closeSound" src="assets/sounds/close.mp3" preload="auto"></audio>

  <script src="game.js" defer></script>
</body>
</html>
